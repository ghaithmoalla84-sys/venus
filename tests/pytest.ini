[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=venus --cov-report=html --cov-report=term --cov-fail-under=60
markers =
    slow: Slow tests (> 1 second)
    integration: Integration tests requiring real DB
    ui: UI tests requiring Qt
    smoke: Quick sanity tests
    db: Database tests
    accounting: Critical accounting logic
